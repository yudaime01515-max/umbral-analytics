name: Actualizar pronósticos

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular pronósticos y cerrar resultados
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
          UMBRAL_DATA_DIR: public/data
          UMBRAL_CACHE_DIR: /tmp/umbral-cache
          LIGAS_MAX_DAYS: "150"
        run: |
          php update.php
          echo "----- registro -----"
          cat /tmp/umbral-cache/update.log || true

      - name: Guardar los datos nuevos
        run: |
          git config user.name "umbral-bot"
          git config user.email "umbral-bot@users.noreply.github.com"
          # Guarda lo que calculó, trae lo último de GitHub y pone encima SOLO los datos calculados.
          # acceso.json (los códigos) nunca se toca desde aquí.
          rm -rf /tmp/nuevos && cp -r public/data /tmp/nuevos && rm -f /tmp/nuevos/acceso.json
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/nuevos/. public/data/
            git add public/data
            git commit -q -m "Actualizar pronósticos" || { echo "Sin cambios"; exit 0; }
            git push -q origin HEAD:main && exit 0
            echo "Otro guardado se cruzó, reintento $i"; sleep 5
          done
          exit 1
