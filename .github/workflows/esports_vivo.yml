name: Esports en vivo

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esports-vivo
  cancel-in-progress: false

jobs:
  vivo:
    runs-on: ubuntu-latest
    env:
      PANDASCORE_KEY: ${{ secrets.PANDASCORE_KEY }}
      UMBRAL_DATA_DIR: public/data
      UMBRAL_CACHE_DIR: /tmp/umbral-cache
    steps:
      - uses: actions/checkout@v4
      - name: Marcadores de esports en juego y guardar
        run: |
          git config user.name "umbral-bot"
          git config user.email "umbral-bot@users.noreply.github.com"
          # GitHub lanza esta tarea cada ~35 min en la práctica, así que cada vez se queda
          # revisando el marcador cada 2 minutos y medio durante 33 minutos.
          fin=$((SECONDS+1980))
          while :; do
            git fetch -q origin main && git reset -q --hard origin/main
            out=$(php esports_live.php); echo "$out"
            case "$out" in *"Sin partidas"*|*"Nada que hacer"*) exit 0;; esac
            if ! git diff --quiet -- public/data; then
              git add public/data
              git commit -q -m "Esports en vivo"
              git push -q origin HEAD:main || echo "Otro guardado se cruzó, se reintenta en la próxima vuelta"
            fi
            [ $SECONDS -ge $fin ] && break
            sleep 150
          done
