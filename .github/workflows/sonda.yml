name: Sonda temporal (borrar)
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Probar ESPN
        run: |
          B=https://site.api.espn.com/apis/site/v2/sports
          python3 - <<'PY'
          import json,urllib.request as u
          def g(url,h={}):
            try:
              r=u.urlopen(u.Request(url,headers=dict({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36','Accept':'application/json'},**h)),timeout=20)
              return r.status, dict(r.headers), r.read().decode('utf-8','replace')
            except Exception as e: return 'ERR',{},str(e)
          for url in ['https://api.sofascore.com/api/v1/sport/football/scheduled-events/2026-11-08',
                      'https://www.sofascore.com/api/v1/sport/football/scheduled-events/2026-11-08',
                      'https://www.fotmob.com/api/data/matches?date=20261108',
                      'https://www.fotmob.com/api/matches?date=20261108']:
            st,h,b=g(url); print('=====',url,st,h.get('Access-Control-Allow-Origin') or h.get('access-control-allow-origin')); print(b[:300])
            if st==200 and 'sofascore' in url:
              ev=[e for e in json.loads(b).get('events',[]) if 'Villarreal' in e['homeTeam']['name']+e['awayTeam']['name'] or 'Levante' in e['homeTeam']['name']+e['awayTeam']['name']]
              for e in ev[:1]:
                st2,h2,b2=g(url.split('/api/')[0]+'/api/v1/event/%s/lineups'%e['id'])
                print('===== lineups',st2,h2.get('Access-Control-Allow-Origin')); d=json.loads(b2) if st2==200 else {}
                print(json.dumps({k:(d.get(k) or {}).get('missingPlayers') for k in ['home','away']},ensure_ascii=False)[:2500])
          PY
