name: Sonda temporal (borrar)
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Probar ESPN
        run: |
          B=https://site.api.espn.com/apis/site/v2/sports
          python3 - <<'PY'
          import json,urllib.request as u
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36','Accept':'application/json'}
          def g(url):
            try: return json.load(u.urlopen(u.Request(url,headers=H),timeout=20))
            except Exception as e: return {'ERR':str(e)}
          d=g('https://www.fotmob.com/api/data/matches?date=20261109')
          ids=[]
          for lg in d.get('leagues',[]):
            for m in lg['matches']:
              ids.append((lg['name'],m['id'],m['home']['name'],m['away']['name'],m.get('status',{}).get('utcTime')))
          print('===== n',len(ids),ids[:5])
          for t in ids[:1]:
            for url in ['https://www.fotmob.com/api/data/matchDetails?matchId=%s'%t[1],'https://www.fotmob.com/api/matchDetails?matchId=%s'%t[1]]:
              j=g(url); print('=====',url,list(j.keys())[:12], j.get('ERR'))
              if 'content' in j:
                lu=(j['content'] or {}).get('lineup') or {}
                print('===== lineup keys',list(lu.keys()))
                for side in ['homeTeam','awayTeam']:
                  tm=lu.get(side) or {}; print('===== '+side, list(tm.keys())); print(json.dumps(tm.get('unavailable'),ensure_ascii=False)[:1500])
                break
          PY
