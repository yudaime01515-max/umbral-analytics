name: Sonda temporal (borrar)
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Probar ESPN
        run: |
          B=https://site.api.espn.com/apis/site/v2/sports
          python3 - <<'PY'
          import json,urllib.request as u
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36','Accept':'application/json'}
          def g(url):
            try: return json.load(u.urlopen(u.Request(url,headers=H),timeout=20))
            except Exception as e: return {'ERR':str(e)}
          for day in ['20261108','20261109','20261110']:
            d=g('https://www.fotmob.com/api/data/matches?date='+day)
            ms=[(lg['name'],m) for lg in d.get('leagues',[]) if lg.get('primaryId') in (47,87,55,54,53,131) for m in lg['matches']]
            print('=====',day,len(ms),[ (n,m['home']['name'],m['away']['name'],m['id']) for n,m in ms[:3]])
            for n,m in ms[:2]:
              j=g('https://www.fotmob.com/api/data/matchDetails?matchId=%s'%m['id'])
              lu=((j.get('content') or {}).get('lineup')) or {}
              print('===== lu',n,m['home']['name'],list(lu.keys()))
              for side in ['homeTeam','awayTeam']:
                tm=lu.get(side) or {}; print('===== '+side, list(tm.keys())); print(json.dumps(tm.get('unavailable'),ensure_ascii=False)[:1200])
          PY
